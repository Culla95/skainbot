[package]
name = "skainbot"
version = "0.1.0"
edition = "2021"

[dependencies]
serenity = { version = "0.12", features = ["client", "gateway", "rustls_backend", "model"] }
songbird = { version = "0.4", features = ["builtin-queue"] }
symphonia = { version = "0.5.2", features = ["all"] }
tokio = { version = "1.34", features = ["macros", "rt-multi-thread", "process", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
parking_lot = "0.12"
log = "0.4"
futures-util = "0.3"
url = "2.5"
regex = "1.10"
tokio-util = { version = "0.7.17", features = ["io", "io-util"] }
simplelog = "0.12"
